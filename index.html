<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="description" content="HSC 2027 Smart Study Management App — planner, focus timer, revisions, practice, exams and analytics for Bangladesh HSC Science students.">
<title>HSC 2027 Study App</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <div class="header-inner">
    <div>
      <strong class="app-title">HSC 2027 Study</strong>
      <span class="muted small" id="header-date"></span>
    </div>
    <span id="online-status" class="online-status">● Online</span>
  </div>
  <div id="reminder-bar" class="reminder-bar" hidden></div>
</header>

<main id="view" class="view" aria-live="polite"></main>

<nav class="bottom-nav" aria-label="Main navigation">
  <button class="nav-btn" data-nav="dashboard"><span class="nav-icon">⌂</span><span>Home</span></button>
  <button class="nav-btn" data-nav="subjects"><span class="nav-icon">📚</span><span>Subjects</span></button>
  <button class="nav-btn" data-nav="planner"><span class="nav-icon">📅</span><span>Planner</span></button>
  <button class="nav-btn" data-nav="focus"><span class="nav-icon">⏱</span><span>Focus</span></button>
  <button class="nav-btn" data-nav="progress"><span class="nav-icon">📊</span><span>Progress</span></button>
  <button class="nav-btn" id="more-btn"><span class="nav-icon">☰</span><span>More</span></button>
</nav>

<div id="modal-overlay" class="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="btn small ghost" data-close-modal aria-label="Close">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<div id="toast-wrap" class="toast-wrap" aria-live="polite"></div>

<script src="js/utils.js"></script>
<script src="js/store.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/subjects.js"></script>
<script src="js/views/planner.js"></script>
<script src="js/views/focus.js"></script>
<script src="js/views/progress.js"></script>
<script src="js/views/library.js"></script>
<script src="js/views/more.js"></script>
<script src="js/views/quiz.js"></script>
<script src="js/app.js"></script>
<script>
  // Header date (Bangladesh local time)
  (function () {
    var el = document.getElementById('header-date');
    function update() {
      try {
        el.textContent = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Dhaka', weekday: 'short', day: 'numeric', month: 'short' }).format(new Date());
      } catch (e) { el.textContent = ''; }
    }
    update();
    setInterval(update, 60000);
  })();
</script>
</body>
</html>
