apply plugin: 'com.android.application'

/**
 * A real release build needs a keystore. The file is never committed: CI writes
 * `android/keystore.properties` + the .jks from repository secrets, and a local
 * build can drop the same pair in place. The legacy package keeps its contributor
 * debug fallback; the separate package is never debug-signed as a release.
 */
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def hasReleaseKeystore = keystorePropertiesFile.exists()
        && keystoreProperties.containsKey('storeFile')
        && rootProject.file(keystoreProperties['storeFile']).exists()

// A deliberately separate install. The default package and its data remain untouched.
def separateInstallFlag = providers.gradleProperty('separateInstall').orElse('false').get()
if (!(separateInstallFlag in ['true', 'false'])) throw new GradleException('separateInstall must be true or false')
def separateInstall = separateInstallFlag == 'true'
def categoryInstallFlag = providers.gradleProperty('categoryInstall').orElse('false').get()
if (!(categoryInstallFlag in ['true', 'false'])) throw new GradleException('categoryInstall must be true or false')
def categoryInstall = categoryInstallFlag == 'true'
def selectedInstallFlag = providers.gradleProperty('selectedInstall').orElse('false').get()
if (!(selectedInstallFlag in ['true', 'false'])) throw new GradleException('selectedInstall must be true or false')
def selectedInstall = selectedInstallFlag == 'true'
def finalInstallFlag = providers.gradleProperty('finalInstall').orElse('false').get()
if (!(finalInstallFlag in ['true', 'false'])) throw new GradleException('finalInstall must be true or false')
def finalInstall = finalInstallFlag == 'true'
def customInstallFlag = providers.gradleProperty('customInstall').orElse('false').get()
if (!(customInstallFlag in ['true', 'false'])) throw new GradleException('customInstall must be true or false')
def customInstall = customInstallFlag == 'true'
def calmInstallFlag = providers.gradleProperty('calmInstall').orElse('false').get()
if (!(calmInstallFlag in ['true', 'false'])) throw new GradleException('calmInstall must be true or false')
def calmInstall = calmInstallFlag == 'true'
def bridgeInstallFlag = providers.gradleProperty('bridgeInstall').orElse('false').get()
if (!(bridgeInstallFlag in ['true', 'false'])) throw new GradleException('bridgeInstall must be true or false')
def bridgeInstall = bridgeInstallFlag == 'true'
if ([separateInstall, categoryInstall, selectedInstall, finalInstall, customInstall, calmInstall, bridgeInstall].count { it } > 1) throw new GradleException('Choose only one separate installation')
def selectedPackage = bridgeInstall ? 'com.prostuti.hsc27.bridge' : calmInstall ? 'com.prostuti.hsc27.calm' : customInstall ? 'com.prostuti.hsc27.custom' : finalInstall ? 'com.prostuti.hsc27.finalapp' : selectedInstall ? 'com.prostuti.hsc27.selected' : categoryInstall ? 'com.prostuti.hsc27.category' : separateInstall ? 'com.prostuti.hsc27.fresh' : 'com.prostuti.hsc27'
def selectedLabel = bridgeInstall ? 'প্রস্তুতি সাথে' : calmInstall ? 'প্রস্তুতি স্বস্তি' : customInstall ? 'প্রস্তুতি নিজের মতো' : finalInstall ? 'প্রস্তুতি ফাইনাল' : selectedInstall ? 'প্রস্তুতি বাছাই' : categoryInstall ? 'প্রস্তুতি ক্রমানুসারে' : separateInstall ? 'প্রস্তুতি নতুন' : null

android {
    namespace = "com.prostuti.hsc27"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId selectedPackage
        manifestPlaceholders = [appLabel: selectedLabel ?: "@string/app_name",
                                activityLabel: selectedLabel ?: "@string/title_activity_main"]
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 24
        versionName "2.44.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments = [expectedPackage: selectedPackage]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Only declared when the keystore is actually present, so a plain clone still builds.
    if (hasReleaseKeystore) {
        signingConfigs {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Play Store uploads prefer an .aab; the APK stays for direct installs.
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else if (separateInstall || categoryInstall || selectedInstall || finalInstall || customInstall || calmInstall || bridgeInstall) {
                // Never disguise a debug-signed package as the new production app.
                signingConfig null
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.activity:activity:1.10.1"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
