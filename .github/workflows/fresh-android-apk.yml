name: Separate Android app
on:
  push:
    branches: ['arena/**']
    paths:
      - 'android/**'
      - 'src/**'
      - 'scripts/check-fresh-*'
      - 'FRESH-ANDROID-RELEASE.md'
      - '.github/workflows/fresh-android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'scripts/check-fresh-*'
      - 'FRESH-ANDROID-RELEASE.md'
      - '.github/workflows/fresh-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fresh-android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  web-checks:
    name: Source and release safety checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - run: node --test scripts/*node-test.mjs
  side-by-side:
    name: Separate install and data safety (Android ${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci && npm run android:assets && npm run android:sync
      - name: Build old and separate test packages
        run: |
          set -o pipefail
          bash scripts/build-fresh-device.sh 2>&1 | tee separate-build.log
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install both packages and exercise saved-state recovery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            bash -o pipefail -c 'bash scripts/check-fresh-device.sh 2>&1 | tee fresh-device.log'
      - name: Surface device failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('fresh-device.log')) core.error(fs.readFileSync('fresh-device.log','utf8').slice(-3500));
            if (fs.existsSync('separate-build.log')) core.error(fs.readFileSync('separate-build.log','utf8').slice(-3500));
            const root = 'android/app/build/outputs/androidTest-results';
            function inspect(dir) {
              if (!fs.existsSync(dir)) return;
              for (const item of fs.readdirSync(dir,{withFileTypes:true})) {
                const path = `${dir}/${item.name}`;
                if (item.isDirectory()) inspect(path);
                else if (item.name.endsWith('.xml')) {
                  for (const failure of fs.readFileSync(path,'utf8').matchAll(/<failure[\s\S]*?<\/failure>/g)) core.error(failure[0].slice(0,3500));
                }
              }
            }
            inspect(root);
      - name: Preserve device test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: separate-android-results-${{ matrix.api }}
          path: |
            fresh-device.log
            separate-build.log
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
  signed-release:
    name: Verified signed separate APK
    if: github.event_name == 'workflow_dispatch'
    needs: [web-checks, side-by-side]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FRESH_KEYSTORE_BASE64: ${{ secrets.FRESH_ANDROID_KEYSTORE_BASE64 }}
      FRESH_KEYSTORE_PASSWORD: ${{ secrets.FRESH_ANDROID_KEYSTORE_PASSWORD }}
      FRESH_KEY_ALIAS: ${{ secrets.FRESH_ANDROID_KEY_ALIAS }}
      FRESH_KEY_PASSWORD: ${{ secrets.FRESH_ANDROID_KEY_PASSWORD }}
      FRESH_ANDROID_CERT_SHA256: ${{ secrets.FRESH_ANDROID_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Require persistent separate release signing material
        run: |
          for name in FRESH_KEYSTORE_BASE64 FRESH_KEYSTORE_PASSWORD FRESH_KEY_ALIAS FRESH_KEY_PASSWORD FRESH_ANDROID_CERT_SHA256; do
            if [ -z "${!name}" ]; then echo "::error::Missing required secret $name. No debug fallback is permitted."; exit 1; fi
          done
      - run: npm ci && npm run android:assets && npm run android:sync
      - name: Sign the separate production APK
        run: |
          umask 077
          printf '%s' "$FRESH_KEYSTORE_BASE64" | base64 -d > android/fresh-release.jks
          cat > android/keystore.properties <<PROPS
          storeFile=fresh-release.jks
          storePassword=$FRESH_KEYSTORE_PASSWORD
          keyAlias=$FRESH_KEY_ALIAS
          keyPassword=$FRESH_KEY_PASSWORD
          PROPS
          cd android
          ./gradlew :app:assembleRelease -PseparateInstall=true --no-daemon --stacktrace
      - name: Verify exact APK, identity, signature, certificate and ZIP
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT=$(find "$SDK_ROOT/build-tools" -name aapt -type f | sort -V | tail -1)
          SIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          node scripts/check-fresh-apk.mjs android/app/build/outputs/apk/release/app-release.apk "$AAPT" "$SIGNER"
          sha256sum android/app/build/outputs/apk/release/app-release.apk > android/app/build/outputs/apk/release/SHA256SUMS.txt
      - name: Remove private signing material
        if: always()
        run: rm -f android/keystore.properties android/fresh-release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: prostuti-fresh-signed-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
