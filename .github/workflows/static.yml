# Prostuti — build, test and deploy the Vite production build to GitHub Pages.
# This replaces the two earlier workflows (raw-repo "static" upload, which would
# overwrite the built site with Vite source files, and deploy-pages.yml).
name: Build & deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      web-proof: ${{ steps.web-proof.outputs.proof }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run production, release and deployment guard tests
        run: node --test scripts/*node-test.mjs

      - name: Build
        run: npm run build

      - name: Browser responsive and offline-media checks
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          npm run test:responsive
          npm run test:study-browser

      - name: Record the exact uploaded web files
        id: web-proof
        run: node scripts/verify-deployed-web.mjs capture dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout read-only public verification tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node for byte verification
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify the real public PWA matches every uploaded file
        env:
          EXPECTED_WEB_PROOF: ${{ needs.build.outputs.web-proof }}
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-deployed-web.mjs verify
