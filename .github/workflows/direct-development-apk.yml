name: Direct development APK download

# One explicitly requested installer from the already-passed main build.
# Not a version release, not on every build, and never an old-release overwrite.
on:
  workflow_dispatch:
    inputs:
      confirm_development_download:
        description: 'Publish a non-Latest debug prerelease, NOT a compatible production update'
        type: boolean
        default: false
  push:
    branches: ['arena/80a86bf2-hsc-27']
    paths: ['.github/workflows/direct-development-apk.yml']

permissions:
  contents: read

concurrency:
  group: direct-development-apk-14e6640e9ae4
  cancel-in-progress: false

jobs:
  direct-download:
    name: Inspect and publish direct development download
    if: >-
      ${{ github.ref == 'refs/heads/arena/80a86bf2-hsc-27' && (
        (github.event_name == 'workflow_dispatch' && inputs.confirm_development_download == true) ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[direct-apk]'))
      ) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout reviewed delivery tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up JDK 21 for original APK inspection
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Test development and production guard boundaries
        run: node --test scripts/publish-development-apk.node-test.mjs scripts/check-android-release.node-test.mjs scripts/verify-release-asset.node-test.mjs
      - name: Verify original bytes and publish development download
        env:
          GH_TOKEN: ${{ github.token }}
          DIRECT_APK_CONFIRMATION: development-only-no-compatible-update
        run: node scripts/publish-development-apk.mjs
      - name: Retain delivery inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-development-apk-evidence
          path: |
            .cache/direct-apk/direct-apk-inspection.json
            .cache/direct-apk/direct-apk-delivery.json
            .cache/direct-apk/SHA256SUMS.txt
          if-no-files-found: ignore
          retention-days: 30
