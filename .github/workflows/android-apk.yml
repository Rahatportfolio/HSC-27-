name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build installable APK
    runs-on: ubuntu-24.04
    env:
      # Optional release signing. Nothing here is required: without the secrets the
      # workflow still produces an installable (debug-signed) APK.
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEYSTORE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and UI tests
        run: npm test

      - name: Generate Android icons and splash screens
        run: npm run android:assets

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Ensure Android platform 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at $SDK_ROOT"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          else
            echo "sdkmanager not available; using the platform bundled with the runner image."
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Check the APK signing key
        run: |
          # A broken or unreadable keystore must fail here, not halfway through the build.
          keytool -list -v -keystore android/prostuti-stable.p12 -storetype PKCS12 \
            -storepass prostuti -alias prostuti | grep -E "Alias name|SHA256:|Valid from" | head -5

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Write release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/prostuti-release.jks
          cat > android/keystore.properties <<PROPS
          storeFile=prostuti-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEYSTORE_KEY_ALIAS
          keyPassword=$KEYSTORE_KEY_PASSWORD
          PROPS
          echo "Release keystore written for alias $KEYSTORE_KEY_ALIAS"

      - name: Build signed release APK and AAB
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Remove keystore
        if: always()
        run: rm -f android/keystore.properties android/*.jks

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          suffix="${GITHUB_REF_NAME//\//-}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/prostuti-hsc27-${suffix}.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "artifacts/prostuti-hsc27-${suffix}-release.apk"
          fi
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "artifacts/prostuti-hsc27-${suffix}.aab"
          fi
          ls -lh artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: prostuti-hsc27-apk
          path: |
            artifacts/*.apk
            artifacts/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.apk
            artifacts/*.aab
          generate_release_notes: true
          body: |
            প্রস্তুতি · HSC 27 — Android APK

            ইনস্টল করার নিয়ম: APK ডাউনলোড করে ফোনে খুলুন, "Install unknown apps" অনুমতি দিন, তারপর ইনস্টল করুন। সব পড়ার তথ্য ফোনেই (offline) থাকে; কোনো অ্যাকাউন্ট বা সার্ভার লাগে না।
