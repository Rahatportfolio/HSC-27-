name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build installable APK
    runs-on: ubuntu-24.04
    env:
      # Optional release signing. Nothing here is required: without the secrets the
      # workflow still produces an installable (debug-signed) APK.
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEYSTORE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and UI tests
        run: npm test

      - name: Generate Android icons and splash screens
        run: npm run android:assets

      - name: Build web app
        run: npm run build

      - name: Browser responsive and offline-media checks
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          npm run test:responsive
          npm run test:study-browser

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Ensure Android platform 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at $SDK_ROOT"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          else
            echo "sdkmanager not available; using the platform bundled with the runner image."
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Write release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/prostuti-release.jks
          cat > android/keystore.properties <<PROPS
          storeFile=prostuti-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEYSTORE_KEY_ALIAS
          keyPassword=$KEYSTORE_KEY_PASSWORD
          PROPS
          echo "Release keystore written for alias $KEYSTORE_KEY_ALIAS"

      - name: Build signed release APK and AAB
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Remove keystore
        if: always()
        run: rm -f android/keystore.properties android/*.jks

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          suffix="${GITHUB_REF_NAME//\//-}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/prostuti-hsc27-${suffix}.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "artifacts/prostuti-hsc27-${suffix}-release.apk"
          fi
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "artifacts/prostuti-hsc27-${suffix}.aab"
          fi
          ls -lh artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: prostuti-hsc27-apk
          path: |
            artifacts/*.apk
            artifacts/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Asset upload finishes before the dependent emulator job. Keep it
          # private until device + Pages checks have explicitly been verified.
          draft: true
          files: |
            artifacts/*.apk
            artifacts/*.aab
          generate_release_notes: true
          body: |
            প্রস্তুতি · HSC 27 — Android APK

            প্রকাশের আগে Android device ও Pages checks-এর ফল যাচাই করতে হবে। APK asset আসা মানেই প্রকাশের অনুমতি নয়।

            আপডেটের আগে backup যাচাই করুন। JSON ও পুরোনো Full backup-এ স্ক্যানের আসল ছবির bytes নেই; আলাদা PDF/ছবি বা মূল ডিভাইস রাখুন। signing mismatch হলে যাচাইকৃত backup ছাড়া পুরোনো অ্যাপ uninstall করবেন না। কোনো অ্যাকাউন্ট বা cloud sync নেই।

  device-checks:
    name: Android WebView device checks
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Prepare instrumented app
        run: |
          npm ci
          npm run android:assets
          npm run android:sync
          cd android
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2 2>&1 | tee ../android-device.log
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native storage, restart, playback and reset on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            cd android && bash -o pipefail -c './gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace 2>&1 | tee ../android-device.log'
      - name: Surface device failure details
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('android-device.log')) {
              const log = fs.readFileSync('android-device.log', 'utf8');
              const important = log.split('\n').filter(line => /failed|failure|exception|error|Test >|What went wrong|Execution failed/i.test(line) && !/^\s*at /.test(line));
              core.error(important.join('\n').slice(-3500) || log.slice(-3500));
            }
            const root = 'android/app/build/outputs/androidTest-results';
            function inspect(dir) {
              if (!fs.existsSync(dir)) return;
              for (const item of fs.readdirSync(dir, {withFileTypes: true})) {
                const path = `${dir}/${item.name}`;
                if (item.isDirectory()) inspect(path);
                else if (item.name.endsWith('.xml')) {
                  const xml = fs.readFileSync(path, 'utf8');
                  for (const failure of xml.matchAll(/<failure[\s\S]*?<\/failure>/g)) core.error(failure[0].slice(0,3500));
                }
              }
            }
            inspect(root);
      - name: Save Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-results
          path: |
            android-device.log
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
