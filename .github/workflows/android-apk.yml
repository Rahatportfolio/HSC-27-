name: Android APK

on:
  workflow_dispatch:
    inputs:
      audit_release:
        description: 'Read-only inspection of an existing release tag; leave empty to build'
        type: string
        default: ''
      audit_sha:
        description: 'Exact source commit expected for the inspected release'
        type: string
        default: ''
      audit_previous:
        description: 'Published signing baseline; continuity is required, not just a valid signature'
        type: string
        default: 'v2.43.0'
  push:
    branches: [main, 'arena/**']
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.audit_release != '' && 'audit' || 'build' }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build installable APK
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.audit_release == '' }}
    runs-on: ubuntu-24.04
    env:
      # Contributor debug builds do not need secrets. A version tag must have
      # complete signing inputs; only the release APK may become a draft asset.
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEYSTORE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require original signing key for tags
        if: startsWith(github.ref, 'refs/tags/v') || env.KEYSTORE_BASE64 != ''
        run: node scripts/check-android-release.mjs signing-inputs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and UI tests
        run: npm test

      - name: Release safety guard tests
        run: node --test scripts/check-android-release.node-test.mjs scripts/verify-release-asset.node-test.mjs

      - name: Generate Android icons and splash screens
        run: npm run android:assets

      - name: Build web app
        run: npm run build

      - name: Browser responsive and offline-media checks
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          npm run test:responsive
          npm run test:mobile-shell
          npm run test:study-browser

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Ensure Android platform 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at $SDK_ROOT"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          else
            echo "sdkmanager not available; using the platform bundled with the runner image."
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Write release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/prostuti-release.jks
          cat > android/keystore.properties <<PROPS
          storeFile=prostuti-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEYSTORE_KEY_ALIAS
          keyPassword=$KEYSTORE_KEY_PASSWORD
          PROPS
          echo "Release keystore prepared; signing values are not logged."

      - name: Build signed release APK and AAB
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Remove keystore
        if: always()
        run: rm -f android/keystore.properties android/*.jks

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          suffix="${GITHUB_REF_NAME//\//-}"
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            # Missing release output is an error, never a debug fallback.
            test -f android/app/build/outputs/apk/release/app-release.apk
            cp android/app/build/outputs/apk/release/app-release.apk "artifacts/prostuti-hsc27-${suffix}.apk"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/prostuti-hsc27-${suffix}-debug.apk"
            if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
              cp android/app/build/outputs/apk/release/app-release.apk "artifacts/prostuti-hsc27-${suffix}-release.apk"
            fi
          fi
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "artifacts/prostuti-hsc27-${suffix}.aab"
          fi
          ls -lh artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: prostuti-hsc27-apk
          path: |
            artifacts/*.apk
            artifacts/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Asset upload finishes before the dependent emulator job. Keep it
          # private until device + Pages checks have explicitly been verified.
          draft: true
          files: |
            artifacts/*.apk
            artifacts/*.aab
          generate_release_notes: true
          body: |
            প্রস্তুতি · HSC 27 — Android APK

            প্রকাশের আগে Android device ও Pages checks-এর ফল যাচাই করতে হবে। APK asset আসা মানেই প্রকাশের অনুমতি নয়।

            signing key বা certificate না মিললে APK প্রকাশ বন্ধ থাকবে। পুরোনো অ্যাপ uninstall বা Clear data করে বাধা কাটাবেন না। JSON ও পুরোনো Full backup-এ স্ক্যানের আসল ছবির bytes নেই; মূল অ্যাপ/ডিভাইস এবং আলাদা PDF/ছবি রাখুন। PWA ও APK-এর ডেটা আলাদা; কোনো অ্যাকাউন্ট বা cloud sync নেই।

  device-checks:
    name: Android WebView device checks (API ${{ matrix.api }})
    # Native jobs compile their own exact-source instrumented app. Run them in
    # parallel with unit/web gates, never bypass them at either publisher.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.audit_release == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Prepare instrumented app
        run: |
          npm ci
          npx tsx scripts/generate-native-test-profiles.ts --check
          npm run android:assets
          npm run android:sync
          cd android
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2 2>&1 | tee ../android-device.log
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native storage, restart, playback and reset on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            # Disposable emulator only: a resumed Activity may still be behind
            # its lock screen after a slow boot/build. Never fake window focus
            # or tap through a permission/system dialog in the instrumentation.
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 2147483647
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell svc wifi disable
            adb shell svc data disable
            bash -o pipefail -c 'status=0; (cd android && ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace 2>&1 | tee ../android-device.log) || status=$?; adb pull /sdcard/Download/prostuti-instrumented-shell ./android-shell-evidence || true; exit "$status"'
      - name: Surface device failure details
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('android-device.log')) {
              const log = fs.readFileSync('android-device.log', 'utf8');
              const important = log.split('\n').filter(line => /failed|failure|exception|error|Test >|What went wrong|Execution failed/i.test(line) && !/^\s*at /.test(line));
              core.error(important.join('\n').slice(-3500) || log.slice(-3500));
            }
            const root = 'android/app/build/outputs/androidTest-results';
            function inspect(dir) {
              if (!fs.existsSync(dir)) return;
              for (const item of fs.readdirSync(dir, {withFileTypes: true})) {
                const path = `${dir}/${item.name}`;
                if (item.isDirectory()) inspect(path);
                else if (item.name.endsWith('.xml')) {
                  const xml = fs.readFileSync(path, 'utf8');
                  for (const failure of xml.matchAll(/<failure[\s\S]*?<\/failure>/g)) core.error(failure[0].slice(0,3500));
                }
              }
            }
            inspect(root);
      - name: Surface native shell evidence
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sharp = require('sharp');
            const dir = 'android-shell-evidence';
            if (!fs.existsSync(dir)) { core.warning('Native shell evidence directory is missing'); return; }
            const measurements = `${dir}/measurements.jsonl`;
            const rows = fs.existsSync(measurements) ? fs.readFileSync(measurements, 'utf8').trim().split('\n').filter(Boolean).map(line => JSON.parse(line)) : [];
            const summary = {api: rows[0]?.androidApi, stageCount: rows.length, freshSetup: rows.find(row => row.stage === 'availability-first'), chrome: rows.filter(row => row.chrome), clocks: rows.filter(row => row.clocks).map(row => ({stage: row.stage, count: row.clocks.length, minFont: Math.min(...row.clocks.map(clock => clock.font)), readable: row.clocks.every(clock => clock.hit && !clock.clipped)})), retained: rows.filter(row => row.notesUnchanged !== undefined), calibratedTaps: rows.filter(row => row.stage === 'native-coordinate-calibration').length, unfocused: rows.find(row => row.stage === 'unfocused-input'), physicalDeviceCertified: false};
            core.notice(JSON.stringify(summary).slice(0, 3500), {title: 'Android shell summary'});
            // GitHub keeps only ten notices per step and truncates each message
            // at 4096 chars. Keep one summary plus <=9 small image chunks. Full
            // resolution, full-frame PNGs and every raw row stay in the artifact.
            const failure = ['unfocused-input', 'blocked-touch', 'failed-input'].find(name => fs.existsSync(`${dir}/${name}.png`));
            const names = failure ? [failure] : ['legacy-scrolled-130', 'personal-scrolled-130', 'personal-offline-brain-after-restart'];
            for (const name of names) {
              const path = `${dir}/${name}.png`;
              if (!fs.existsSync(path)) continue;
              let pixels = await sharp(path).resize({width: 320}).toBuffer();
              if (!failure) {
                const meta = await sharp(pixels).metadata();
                pixels = await sharp(pixels).extract({left: 0, top: 0, width: meta.width, height: Math.min(200, meta.height)}).toBuffer();
              }
              const limit = failure ? 27000 : 9000;
              let data = '';
              for (const quality of [60, 50, 40, 30, 20]) {
                data = (await sharp(pixels).webp({quality}).toBuffer()).toString('base64');
                if (data.length <= limit) break;
              }
              if (data.length > limit) { core.warning(`Preview too large; use full artifact for ${name}.png`); continue; }
              const total = Math.ceil(data.length / 3000);
              for (let part = 0; part < total; part++) {
                core.notice(JSON.stringify({name: `${name}${failure ? '' : '-top'}.webp`, croppedToTop: !failure, encoding: 'base64', part, total, data: data.slice(part * 3000, (part + 1) * 3000)}), {title: `Android shell image ${name} part ${part + 1}/${total}`});
              }
            }
      - name: Save Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-results-api-${{ matrix.api }}
          path: |
            android-device.log
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android-shell-evidence/
          if-no-files-found: ignore

  artifact-audit:
    name: Inspect uploaded release APK
    needs: [apk, device-checks]
    if: >-
      ${{ always() && (
        (github.event_name == 'workflow_dispatch' && inputs.audit_release != '') ||
        (startsWith(github.ref, 'refs/tags/v') && needs.apk.result == 'success' && needs['device-checks'].result == 'success')
      ) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # A read-only token cannot see drafts (verified in CI). All inspection
      # requests are still GET-only: no asset replacement or publication.
      contents: write
    steps:
      - name: Checkout inspection tooling
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test inspection guards
        run: node --test scripts/check-android-release.node-test.mjs scripts/verify-release-asset.node-test.mjs
      - name: Verify existing APK bytes, version and signing
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_RELEASE_TAG: ${{ inputs.audit_release || github.ref_name }}
          AUDIT_EXPECTED_SHA: ${{ inputs.audit_sha || github.sha }}
          AUDIT_PREVIOUS_TAG: ${{ inputs.audit_previous || 'v2.43.0' }}
        run: node scripts/verify-release-asset.mjs
      - name: Require direct-update signing continuity
        run: node scripts/check-android-release.mjs compatible-update release-asset-verification.json
      - name: Save inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-verification
          path: release-asset-verification.json
          if-no-files-found: error

  built-web:
    name: Built web acceptance
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.audit_release == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Test budget and development-download safety boundaries
        run: node --test scripts/check-build-budget.node-test.mjs scripts/publish-current-development-apk.node-test.mjs
      - name: Build production assets with mandatory budgets
        run: npm run build
      - name: Full production browser acceptance
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          WEB_BROWSER_OUTPUT: .cache/built-web
        run: npm run test:built-web
      - name: Surface browser checkpoints and exact failing accessibility targets
        if: always()
        run: node scripts/summarize-browser-evidence.mjs .cache/built-web
      - name: Retain raw browser evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: built-web-evidence
          path: .cache/built-web/
          if-no-files-found: ignore
          retention-days: 30

  current-development-download:
    name: Current tested development APK download
    needs: [apk, device-checks, built-web]
    if: >-
      ${{ github.event_name == 'push' &&
        github.ref == 'refs/heads/arena/80a86bf2-hsc-27' &&
        contains(github.event.head_commit.message, '[current-dev-apk]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up JDK 21 for APK signature inspection
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Test all production and development guard boundaries
        run: node --test scripts/check-android-release.node-test.mjs scripts/verify-release-asset.node-test.mjs scripts/publish-development-apk.node-test.mjs scripts/publish-current-development-apk.node-test.mjs
      - name: Inspect exact APK and publish non-Latest development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_DEV_APK_CONFIRMATION: current-development-only-no-compatible-update
        run: node scripts/publish-current-development-apk.mjs
      - name: Retain APK inspection and delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-development-apk-evidence
          path: |
            .cache/current-dev-apk/inspection.json
            .cache/current-dev-apk/delivery.json
            .cache/current-dev-apk/SHA256SUMS.txt
          if-no-files-found: ignore
          retention-days: 30
