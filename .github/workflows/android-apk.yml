name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and UI tests
        run: npm test

      - name: Generate Android icons and splash screens
        run: npm run android:assets

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/prostuti-hsc27-${GITHUB_REF_NAME//\//-}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: prostuti-hsc27-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
          body: |
            প্রস্তুতি · HSC 27 — Android APK

            ইনস্টল করার নিয়ম: APK ডাউনলোড করে ফোনে খুলুন, "Install unknown apps" অনুমতি দিন, তারপর ইনস্টল করুন। সব পড়ার তথ্য ফোনেই (offline) থাকে; কোনো অ্যাকাউন্ট বা সার্ভার লাগে না।
